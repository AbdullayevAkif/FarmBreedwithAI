spring.application.name=FarmBreedwithAI
# Gemini AI Configuration
gemini.api-key=AIzaSyB_fIXDIPFFWH_TlcE4WFNETQsmW8eaP2U
gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
gemini.api.model=gemini-2.0-flash-exp

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/animalsMateDb
spring.datasource.username=user
spring.datasource.password=akif2005
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.deserialization.fail-on-unknown-properties=false

# Logging Configuration
logging.level.com.breedmate=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m

# Application Information
info.app.name=BreedMate AI
info.app.description=AI-Powered Farm Animal Breeding Assistant
info.app.version=1.0.0
info.app.developer=Farm Tech Solutions

# AI Service Configuration
ai.response.timeout=30000
ai.max.retries=3
ai.cache.enabled=true

# Breeding Algorithm Configuration
breeding.compatibility.min-score=60
breeding.diversity.threshold=80
breeding.max.recommendations=10

# Photo Analysis Configuration
photo.analysis.max-size=10MB
photo.analysis.supported-formats=jpg,jpeg,png,webp
photo.analysis.confidence.threshold=0.7

# API Rate Limiting
api.rate-limit.enabled=true
api.rate-limit.requests-per-minute=100

# Development Mode
spring.profiles.active=dev

# JWT Configuration
jwt.secret=mySecretKeyForFarmBreedAIApplication2024
jwt.expiration=86400000

# CORS Configuration
cors.allowed.origins=*
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
cors.allow.credentials=true

# Security Filter Order
spring.security.filter.order=0